org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# In-process Kotlin compilation: the daemon writes under ~/Library, which sandboxed builds cannot.
kotlin.compiler.execution.strategy=in-process
# The LiteRT-LM runtime the three model cards' Kotlin examples were run with; shown on screen as the runtime version.
litertlmVersion=0.17.1
