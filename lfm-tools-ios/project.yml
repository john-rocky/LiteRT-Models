name: LFMTools
options:
  bundleIdPrefix: com.lfmtools
  deploymentTarget:
    iOS: "27.0"
packages:
  # The local checkout, not the released package: the Foundation Models adapter
  # this demo needs (constrained tool routing) lives on that branch.
  LiteRTLM:
    path: ../../litert-lm-applefm-fix
targets:
  LFMTools:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
      - package: LiteRTLM
        product: LiteRTLMFoundationModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lfmtools.app
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MFN25KNUGJ
        # Drop a .litertlm in with Files.app.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # One line per tool that asks. iOS kills the app on a missing string, so
        # every permissioned tool in ToolBox.personal has to be represented here.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Answers questions about where you are.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Reads and adds calendar events.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Reads and adds reminders.
        INFOPLIST_KEY_NSContactsUsageDescription: Looks people up in your address book.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Counts what is in your photo library.
        INFOPLIST_KEY_NSCameraUsageDescription: Switches the rear flashlight on and off.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
