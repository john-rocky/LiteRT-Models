android.useAndroidX=true
org.gradle.jvmargs=-Xmx4096m
# In-process Kotlin compilation: the daemon writes under ~/Library, which sandboxed builds cannot.
kotlin.compiler.execution.strategy=in-process
# LiteRT runtime (com.google.ai.edge.litert:litert); the app shows this version on screen.
litertVersion=2.1.3
